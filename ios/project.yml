name: Moove
options:
  bundleIdPrefix: app.moove
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Fetches big Core ML models that aren't in git (skips on CI/offline).
  preGenCommand: scripts/fetch-models.sh
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MooveKit:
    path: MooveKit
  MooveBindings:
    path: MooveBindings
  SpacetimeDB:
    # Community SDK (ekscrypto). Pinned: spike-verified against SpacetimeDB 2.13.
    url: https://github.com/ekscrypto/spacetimedb-swift-sdk
    revision: c966b6b5bab9248e186a7453de94bc6c49e07fb6
  Auth0:
    url: https://github.com/auth0/Auth0.swift
    exactVersion: 3.1.0
targets:
  Moove:
    type: application
    platform: iOS
    sources:
      - path: Moove
    configFiles:
      Debug: Config/Moove.xcconfig
      Release: Config/Moove.xcconfig
    dependencies:
      - package: MooveKit
      - package: MooveBindings
      - package: SpacetimeDB
        product: SpacetimeDB
      - package: SpacetimeDB
        product: BSATN
      - package: Auth0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MOOVE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Moove/Resources/Info.plist
      properties:
        CFBundleDisplayName: Moove
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Moove uses the camera and LiDAR to scan your room and photograph your belongings.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: Moove connects to the team's dev server on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: auth0
            CFBundleURLSchemes: [$(PRODUCT_BUNDLE_IDENTIFIER)]
        MooveSpacetimeHost: $(MOOVE_SPACETIME_HOST)
        MooveSpacetimeDB: $(MOOVE_SPACETIME_DB)
        MooveUploadBaseURL: $(MOOVE_UPLOAD_BASE_URL)
        MooveAuth0Domain: $(MOOVE_AUTH0_DOMAIN)
        MooveAuth0ClientId: $(MOOVE_AUTH0_CLIENT_ID)
schemes:
  Moove:
    build:
      targets:
        Moove: all
    run:
      config: Debug
