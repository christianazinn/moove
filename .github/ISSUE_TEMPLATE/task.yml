name: Task
description: A unit of work someone can claim, finish and merge
labels: ["task"]
body:
  - type: dropdown
    id: lane
    attributes:
      label: Lane
      options: [backend, ios-capture, ios-newhome, commerce]
    validations: { required: true }
  - type: textarea
    id: goal
    attributes: { label: Goal }
    validations: { required: true }
  - type: input
    id: depends
    attributes: { label: Depends on (issue numbers) }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria }
  - type: textarea
    id: fallback
    attributes: { label: Demo fallback }
