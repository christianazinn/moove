name: CI
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR (or to main) supersedes the older run, so the few macOS runners
# aren't spent on commits nobody will merge.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which lanes a PR touches. The macOS app build only runs when ios/ (or CI itself) changed;
  # a job skipped by `if:` reports success, so it still satisfies the required `ios` check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.f.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: f
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(ios/|\.github/workflows/)'; then echo "ios=true"; else echo "ios=false"; fi >> "$GITHUB_OUTPUT"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1 # [[allowlists]] in .gitleaks.toml needs >= 8.25
      # The action only scans the commits in this PR/push. This scans every commit on every fetched
      # ref (all branches), so "gitleaks detect is clean on the full history" is checked. It only
      # gates pushes to main: on PRs it reports but can't fail, so one flagged string on a
      # teammate's branch doesn't turn every PR red.
      - name: gitleaks full-history scan
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --log-opts="--all" --redact --no-banner -v

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [spacetime, agents]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Typecheck and test (skips until package.json exists)
        working-directory: ${{ matrix.dir }}
        run: |
          if [ ! -f package.json ]; then echo "no package.json yet, skipping"; exit 0; fi
          npm ci || npm install
          npm run --if-present typecheck
          npm run --if-present test

  e2e:
    # Whole pipeline on a local SpacetimeDB with replayed Claude answers (no API calls, no Apify).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Start local SpacetimeDB
        run: |
          (spacetime start > /tmp/stdb.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:3000/v1/ping && break; sleep 1; done
      - name: Install
        run: |
          (cd spacetime && npm ci)
          (cd agents && npm ci)
      - name: E2E (replay only)
        working-directory: agents
        run: npm run e2e -- --replay
      - name: Worker log
        if: failure()
        run: tail -100 agents/.cache/e2e/worker.log || true

  moovekit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift test (skips until ios/MooveKit exists)
        run: |
          if [ ! -f ios/MooveKit/Package.swift ]; then echo "no MooveKit yet, skipping"; exit 0; fi
          docker run --rm -v "$PWD/ios/MooveKit:/pkg" -w /pkg swift:6.2 swift test

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app (skips until ios/project.yml exists)
        run: |
          if [ ! -f ios/project.yml ]; then echo "no project.yml yet, skipping"; exit 0; fi
          # The Swift SpacetimeDB SDK needs Swift 6.2+ (SendableMetatype); use the newest Xcode on the runner.
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); echo "using $XC"; sudo xcode-select -s "$XC"
          swift --version
          brew install xcodegen
          cd ios && xcodegen
          xcodebuild -scheme Moove -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  ios-ui:
    # Runs the app in an iOS Simulator on the offline demo backend: the `Moove` scheme's test action
    # (ios/MooveUITests, CommerceUITests for now). Screenshots are in the `ios-ui-screenshots` artifact.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and a simulator
        run: |
          # Same as `ios`: the Swift SpacetimeDB SDK needs Swift 6.2+, so use the newest Xcode.
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); echo "using $XC"; sudo xcode-select -s "$XC"
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version); echo "iphonesimulator SDK $SDK"
          # Newest iOS runtime the SDK supports, first iPhone on it.
          xcrun simctl list devices available -j | python3 -c '
          import json, sys
          sdk = tuple(int(p) for p in sys.argv[1].split("."))
          best = None
          for rt, devs in json.load(sys.stdin)["devices"].items():
              if ".iOS-" not in rt: continue
              ver = tuple(int(p) for p in rt.split(".iOS-")[1].split("-"))
              if ver[:2] > sdk[:2]: continue
              for d in devs:
                  if d["name"].startswith("iPhone") and (best is None or ver > best[0]):
                      best = (ver, d["udid"], d["name"])
          if best is None: sys.exit("no available iPhone simulator")
          print("SIM_UDID=" + best[1]); print("simulator: %s, iOS %s" % (best[2], ".".join(map(str, best[0]))), file=sys.stderr)
          ' "$SDK" >> "$GITHUB_ENV"
      - name: Generate project
        run: |
          brew install xcodegen
          cd ios && xcodegen
      - name: UI tests (offline demo)
        working-directory: ios
        run: |
          xcrun simctl boot "$SIM_UDID" || true
          # Only the commerce suite gates CI for now: MooveSmokeTests (#161) still has two tests that time
          # out on the slower CI runner, and running both suites goes past ~15 min.
          xcodebuild test -scheme Moove -destination "id=$SIM_UDID" -only-testing:MooveUITests/CommerceUITests \
            -resultBundlePath "$RUNNER_TEMP/MooveUITests.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/all" "$RUNNER_TEMP/shots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/MooveUITests.xcresult" --output-path "$RUNNER_TEMP/all" || true
          # Keep only the tests' named screenshots (not XCTest's automatic snapshots or the screen recording),
          # renamed "<Test class>/<shot name>.png".
          python3 - "$RUNNER_TEMP/all" "$RUNNER_TEMP/shots" <<'PY'
          import json, os, shutil, sys
          src, dst = sys.argv[1], sys.argv[2]
          try:
              tests = json.load(open(os.path.join(src, "manifest.json")))
          except OSError:
              sys.exit(0)
          for test in tests:
              cls = test["testIdentifier"].split("/")[0]
              for a in test["attachments"]:
                  name, f = a["suggestedHumanReadableName"], a["exportedFileName"]
                  if not f.endswith(".png") or name.startswith("UI Snapshot"):
                      continue
                  os.makedirs(os.path.join(dst, cls), exist_ok=True)
                  shutil.copy(os.path.join(src, f), os.path.join(dst, cls, name.split("_0_")[0] + ".png"))
          PY
          find "$RUNNER_TEMP/shots" -type f
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ui-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ui-xcresult
          path: ${{ runner.temp }}/MooveUITests.xcresult
          if-no-files-found: warn
          retention-days: 3
