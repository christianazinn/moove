name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1 # [[allowlists]] in .gitleaks.toml needs >= 8.25
      # The action only scans the commits in this PR/push. This scans every commit on every fetched
      # ref (all branches), so "gitleaks detect is clean on the full history" is checked. It only
      # gates pushes to main: on PRs it reports but can't fail, so one flagged string on a
      # teammate's branch doesn't turn every PR red.
      - name: gitleaks full-history scan
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --log-opts="--all" --redact --no-banner -v

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [spacetime, agents]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Typecheck and test (skips until package.json exists)
        working-directory: ${{ matrix.dir }}
        run: |
          if [ ! -f package.json ]; then echo "no package.json yet, skipping"; exit 0; fi
          npm ci || npm install
          npm run --if-present typecheck
          npm run --if-present test

  moovekit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift test (skips until ios/MooveKit exists)
        run: |
          if [ ! -f ios/MooveKit/Package.swift ]; then echo "no MooveKit yet, skipping"; exit 0; fi
          docker run --rm -v "$PWD/ios/MooveKit:/pkg" -w /pkg swift:6.2 swift test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app (skips until ios/project.yml exists)
        run: |
          if [ ! -f ios/project.yml ]; then echo "no project.yml yet, skipping"; exit 0; fi
          # The Swift SpacetimeDB SDK needs Swift 6.2+ (SendableMetatype); use the newest Xcode on the runner.
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); echo "using $XC"; sudo xcode-select -s "$XC"
          swift --version
          brew install xcodegen
          cd ios && xcodegen
          xcodebuild -scheme Moove -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
